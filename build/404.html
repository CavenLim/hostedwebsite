<!-- public/404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <script>
    // This script forces a redirect to your app's index.html
    // This is how React Router will take over client-side routing
    var redirect = window.location.href;
    if (redirect.indexOf('.html') === -1) {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <h1>404 - Page Not Found</h1>
  <p>It seems you've reached an invalid page.</p>
</body>
</html>
